services:
  db:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_USER: lel_user
      POSTGRES_PASSWORD: lakeeffect
      POSTGRES_DB: lel_db
    ports:
      - "5432:5432"
    volumes:
      - lel-postgres-data:/var/lib/postgresql/data

volumes:
  lel-postgres-data:
